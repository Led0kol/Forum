version: '3.8'

services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-sqlite-app
    ports:
      - "8081:8000"
    volumes:
      # Монтируем код для горячей перезагрузки
      #- ./app:/app/app
      # Монтируем папку с БД для персистентности
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/app.db
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload