<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Форум{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='/favicon.ico') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="brand">Форум</a>
            <div class="nav-links">
                {% if current_user %}
                    <span>Привет, {{ current_user.username }}!</span>
                    <a href="/topic/create">Создать тему</a>
                    <a href="/logout">Выход</a>
                {% else %}
                    <a href="/login">Вход</a>
                    <a href="/register">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 OTUS Форум на Python.</p>
        </div>
    </footer>
</body>
</html>
