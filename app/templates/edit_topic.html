{% extends "base.html" %}

{% block title %}Редактирование - Форум{% endblock %}

{% block content %}
<h1>Редактирование темы</h1>

<form method="post" action="/topic/{{ topic.id }}/edit">
    <div class="form-group">
        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title" required value="{{ topic.title }}">
    </div>
    
    <div class="form-group">
        <label for="content">Содержание</label>
        <textarea id="content" name="content" rows="10" required>{{ topic.content }}</textarea>
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/topic/{{ topic.id }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
