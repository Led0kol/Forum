name: CI/CD Pipeline for Windows Server 2025

on:
  push:
    branches: [ "master" ]  # или "main", если у вас основная ветка так называется
  pull_request:
    branches: [ "master" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/forum-fastapi-app-git
  DEPLOY_PATH: "/c/deploy/forum"  # Путь на Windows Server в Unix-стиле

jobs:
  # ============================================
  # JOB 1: Тестирование (CI)
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        echo "🧪 Running tests..."
        # Если у вас есть тесты - раскомментируйте
        # pytest
        echo "✅ Tests passed!"

  # ============================================
  # JOB 2: Сборка Docker образа
  # ============================================
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

    - name: Image info
      run: |
        echo "✅ Docker image built and pushed!"
        echo "📦 Image: ${{ env.DOCKER_IMAGE }}:latest"
        echo "📦 Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  # ============================================
  # JOB 3: Деплой на Windows Server (CD)
  # ============================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment directory structure
      run: |
        echo "📁 Preparing deployment files..."
        mkdir -p deploy_temp
        cp docker-compose.yml deploy_temp/
        cp -r app deploy_temp/
        cp -r static deploy_temp/
        echo "✅ Files prepared"

    #- #name: Copy files to Windows Server via SCP
    #  #uses: appleboy/scp-action@v1
    #  #with:
    #  #  host: ${{ secrets.WINDOWS_HOST }}
    #  #  username: ${{ secrets.WINDOWS_USERNAME }}
    #  #  key: ${{ secrets.WINDOWS_SSH_KEY }}
    #  #  port: ${{ secrets.WINDOWS_PORT }}
    #  #  source: "deploy_temp/*"
    #  #  target: "${{ env.DEPLOY_PATH }}"
    #  #  strip_components: 1
    #  #  overwrite: true

    - name: Deploy on Windows Server via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.WINDOWS_HOST }}
        username: ${{ secrets.WINDOWS_USERNAME }}
        key: ${{ secrets.WINDOWS_SSH_KEY }}
        port: ${{ secrets.WINDOWS_PORT }}
        script: |
          echo "=========================================="
          echo "🚀 STARTING DEPLOYMENT"
          echo "=========================================="
          
          cd ${{ env.DEPLOY_PATH }}
          
          echo "📁 Current directory: $(pwd)"
          echo "📂 Files:"
          ls -la
          
          echo "🔄 Stopping old containers..."
          docker-compose down || true
          
          echo "🔄 Pulling latest images..."
          docker-compose pull || true
          
          echo "🔄 Starting new containers..."
          docker-compose up -d --build
          
          echo "📊 Checking container status..."
          docker-compose ps
          
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE!"
          echo "🌐 App should be running on port 8081"
          echo "=========================================="

  # ============================================
  # JOB 4: Проверка работоспособности (опционально)
  # ============================================
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Wait for app to start
      run: |
        echo "⏳ Waiting 15 seconds for app to start..."
        sleep 15

    - name: Health check
      uses: jtalk/url-health-check-action@v4
      with:
        url: "http://${{ secrets.WINDOWS_HOST }}:8081"
        max-attempts: 5
        retry-delay: 5s

    - name: Health check result
      run: |
        echo "✅ Health check passed!"
        echo "🌐 Application is running at: http://${{ secrets.WINDOWS_HOST }}:8081"